<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Gravidade</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="gameCanvas"></canvas>
  <video id="videoOverlay" playsinline muted></video>

  <!-- HUD começa oculto -->
  <div id="hud" style="display:none">
    <span id="labelTempo">Tempo: 0s</span>
    <span id="labelFase">Fase: 1</span>
    <button id="btnSair">Sair</button>
  </div>

  <div id="overlayContainer"></div>

  <!-- Scripts (ordem importa) -->
  <script src="js/GameState.js"></script>
  <script src="js/PhaseManager.js"></script>
  <script src="js/Physics.js"></script>
  <script src="js/MagnetSystem.js"></script>
  <script src="js/BlackHole.js"></script>
  <script src="js/ItemFactory.js"></script>
  <script src="js/HUD.js"></script>
  <script src="js/OverlayManager.js"></script>
  <script src="js/IntroSystem.js"></script>
  <script src="js/main.js"></script>

  <!-- Detector de erro global: mostra mensagem na tela se algo quebrar -->
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:#fff;padding:16px;font-size:14px;z-index:9999;white-space:pre-wrap">' +
        '\u274c ERRO JS: ' + e.message + '\n' + (e.filename || '') + ':' + e.lineno + '</div>';
    });
  </script>

</body>
</html>
